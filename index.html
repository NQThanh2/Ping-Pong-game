<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #e5e5e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }
        #board {
            width: 500px;
            height: 500px;
            background: black;
            border: 5px solid skyblue;
            border-bottom: 0;
            position: relative;
        }

        .score, .lives, .brick-container, .portal-container,
        .brick, .portal, .ball, .paddle, .message {
            position: absolute;
        }

        .score, .lives {
            top: 10px;
            font-size: 20px;
            line-height: 1;
            user-select: none;
        }
        .score { left: 10px; color: white; }
        .lives { right: 10px; color: tomato; }

        .brick-container, .portal-container {
            inset: 0;
        }

        .brick {
            width: 50px;
            height: 10px;
            background: skyblue;
        }
        .brick[data-hp="2"] { background: #ffb347; }
        .brick[data-hp="3"] { background: #d9364f; }
        .brick[data-steel="true"] {
            box-sizing: border-box;
            background: #929da7;
            border: 1px solid #9aa4ae;
        }

        .portal-container { pointer-events: none; }
        .portal {
            box-sizing: border-box;
            border: 3px solid #31cfff;
            border-radius: 50%;
            background: #0f172a;
        }
        .portal[data-portal="B"] { border-color: #bf7bff; }

        .level-selector { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; max-width: 510px; }
        .level-button { padding: 8px 20px; border: 2px solid #247ba0; border-radius: 6px; background: skyblue; color: #12384a; cursor: pointer; font: inherit; }
        .level-button.active { background: #176b91; color: white; }

        .ball {
            width: 10px;
            height: 10px;
            background: red;
        }

        .paddle {
            width: 80px;
            height: 10px;
            background: lightgreen;
            bottom: 5px;
        }

        .message {
            z-index: 1;
            top: 50%;
            left: 0;
            right: 0;
            padding: 20px;
            transform: translateY(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.8);
            text-align: center;
            font-size: 24px;
            line-height: 1.6;
            pointer-events: none;
            user-select: none;
        }

        .message small {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="board">
        <div class="score">0</div>
        <div class="lives">❤️❤️❤️</div>
        <div class="brick-container"></div>
        <div class="portal-container"></div>
        <div class="ball"></div>
        <div class="paddle"></div>
        <div class="message"></div>
    </div>
    <nav class="level-selector"></nav>
    <script src="game.js"></script>
</body>
</html>
