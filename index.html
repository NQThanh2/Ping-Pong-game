<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
        }
        #board {
            width: 500px;
            height: 500px;
            background-color: black;
            border-top: 5px solid skyblue;
            border-left: 5px solid skyblue;
            border-right: 5px solid skyblue;
            position: relative;
            box-sizing: content-box;
        }

        .score {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            line-height: 1;
            user-select: none;
        }

        .brick-container {
            position: absolute;
            inset: 0;
        }

        .brick {
            position: absolute;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 10px;
            background-color: skyblue;
            color: #17202a;
            font-size: 11px;
            font-weight: bold;
            line-height: 1;
            user-select: none;
        }

        .brick[data-hp="2"] {
            background-color: #ffb347;
        }

        .brick[data-hp="3"] {
            background-color: #d9364f;
            color: white;
        }

        .brick[data-steel="true"] {
            background: linear-gradient(#dce3e8, #737e88);
            border: 1px solid #9aa4ae;
            box-shadow: inset 0 1px #f6f8fa;
        }

        .portal-container { position: absolute; inset: 0; pointer-events: none; }
        .portal { --portal-color: #31cfff; position: absolute; box-sizing: border-box; border: 3px solid var(--portal-color); border-radius: 50%; background: rgba(15, 23, 42, 0.75); box-shadow: 0 0 12px var(--portal-color); }
        .portal[data-portal="B"] { --portal-color: #bf7bff; }

        .level-selector { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; max-width: 510px; }
        .level-button { padding: 8px 20px; border: 2px solid #247ba0; border-radius: 6px; background: skyblue; color: #12384a; cursor: pointer; font: inherit; }
        .level-button.active { background: #176b91; color: white; }

        .ball {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: red;
            bottom: 15px;
            left: 245px;
        }

        .paddle {
            position: absolute;
            width: 80px;
            height: 10px;
            background-color: lightgreen;
            bottom: 5px;
            left: 210px; /* (500 - 80) / 2 */
        }

        .lives {
            position: absolute;
            top: 10px;
            right: 10px;
            color: tomato;
            font-size: 20px;
            line-height: 1;
            user-select: none;
        }

        .message {
            position: absolute;
            z-index: 1;
            top: 50%;
            left: 0;
            right: 0;
            padding: 20px;
            transform: translateY(-50%);
            color: white;
            background-color: rgba(0, 0, 0, 0.8);
            text-align: center;
            font-size: 24px;
            line-height: 1.6;
            pointer-events: none;
            user-select: none;
        }

        .message small {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="board">
        <div class="score">0</div>
        <div class="lives">❤️❤️❤️</div>
        <div class="brick-container"></div>
        <div class="portal-container"></div>
        <div class="ball"></div>
        <div class="paddle"></div>
        <div class="message"></div>
    </div>
    <nav class="level-selector"></nav>
    <script src="game.js"></script>
</body>
</html>
