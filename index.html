<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong</title>
    <style>
        body, .level-selector {
            display: flex;
            justify-content: center;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #e5e5e5;
            font-family: sans-serif;
            flex-direction: column;
            align-items: center;
        }

        #board {
            position: relative;
            width: 500px;
            height: 500px;
            background: black;
            border: 5px solid skyblue;
            border-bottom: 0;
        }

        #board > div, .brick { position: absolute; }
        .score, .lives, .brick, .message { user-select: none; }
        .brick, .ball, .paddle { height: 10px; }

        .score, .lives {
            top: 10px;
            font-size: 20px;
            line-height: 1;
        }

        .score { left: 10px; color: white; }
        .lives { right: 10px; color: tomato; }
        .brick-container { inset: 0; }
        .brick { width: 50px; background: skyblue; }
        .brick[data-hp="2"] { background: #ffb347; }
        .brick[data-hp="3"] { background: #d9364f; }

        .ball {
            width: 10px;
            background: red;
            bottom: 15px;
            left: 245px;
        }

        .paddle {
            width: 80px;
            background: lightgreen;
            bottom: 5px;
            left: 210px; /* (500 - 80) / 2 */
        }

        .message {
            top: 50%;
            left: 0;
            right: 0;
            padding: 20px;
            transform: translateY(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.8);
            text-align: center;
            font-size: 24px;
            line-height: 1.6;
            pointer-events: none;
        }

        .message small { font-size: 16px; }

        .level-selector {
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .level-button {
            padding: 8px 20px;
            border: 2px solid #247ba0;
            border-radius: 6px;
            background: skyblue;
            color: #12384a;
            font: inherit;
            cursor: pointer;
        }

        .level-button:hover { background: #b9e5f6; }

        .level-button:focus-visible {
            outline: 3px solid #12384a;
            outline-offset: 3px;
        }

        .level-button[aria-pressed="true"] {
            background: #176b91;
            color: white;
        }
    </style>
</head>
<body>
    <div id="board">
        <div class="score">0</div>
        <div class="lives">❤️❤️❤️</div>
        <div class="brick-container"></div>
        <div class="ball"></div>
        <div class="paddle"></div>
        <div class="message" role="status" aria-live="polite"></div>
    </div>
    <nav class="level-selector" aria-label="Chọn màn"></nav>
    <script src="game.js"></script>
</body>
</html>
